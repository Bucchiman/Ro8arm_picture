# Klipper macros for the painting machine (templates; positions mirror configs/machine.yaml).
# Include from printer.cfg:  [include painter_macros.cfg]
# Re-measure every position on the real machine.

# Brush rotation axis exposed to G-code as "A" (requires a Klipper version with manual_stepper gcode_axis support).
# [manual_stepper brush_rot]
# step_pin: ...
# dir_pin: ...
# enable_pin: ...
# microsteps: 16
# rotation_distance: 360   # degrees per motor revolution
# velocity: 360
# accel: 2000
#
# [delayed_gcode painter_register_axis]
# initial_duration: 0.1
# gcode:
#   MANUAL_STEPPER STEPPER=brush_rot GCODE_AXIS=A

[gcode_macro _PAINTER_VARS]
variable_travel_z: 15
variable_travel_f: 9000
variable_z_f: 1200
variable_palette_x0: 440
variable_palette_y0: 20
variable_palette_dx: 40
variable_palette_dy: 40
variable_palette_cols: 2
variable_wash_x: 530
variable_wash_y: 60
variable_wash_r: 12
variable_wash_z: -20
variable_wash_circles: 6
variable_wipe_x: 530
variable_wipe_y: 160
variable_wipe_len: 60
variable_wipe_passes: 3
variable_rack_x: 530
variable_rack_y0: 230
variable_rack_dy: 30
variable_current_brush: -1
gcode:

[gcode_macro PAINTER_START]
gcode:
  G28
  G90
  G0 Z{printer["gcode_macro _PAINTER_VARS"].travel_z} F{printer["gcode_macro _PAINTER_VARS"].z_f}

[gcode_macro PAINTER_END]
gcode:
  {% set v = printer["gcode_macro _PAINTER_VARS"] %}
  {% if v.current_brush >= 0 %}
    TOOL_PLACE BRUSH={v.current_brush}
  {% endif %}
  G0 Z{v.travel_z} F{v.z_f}
  M84

[gcode_macro TOOL_PLACE]
gcode:
  {% set v = printer["gcode_macro _PAINTER_VARS"] %}
  {% set b = params.BRUSH|int %}
  {% set y = v.rack_y0 + b * v.rack_dy %}
  G0 Z{v.travel_z} F{v.z_f}
  G0 X{v.rack_x - 30} Y{y} A0 F{v.travel_f}
  G0 Z0 F{v.z_f}
  G1 X{v.rack_x} F3000          ; slide brush into the rack slot
  # TODO: release coupling (servo / magnet) here
  G0 Z{v.travel_z} F{v.z_f}
  SET_GCODE_VARIABLE MACRO=_PAINTER_VARS VARIABLE=current_brush VALUE=-1

[gcode_macro TOOL_PICK]
gcode:
  {% set v = printer["gcode_macro _PAINTER_VARS"] %}
  {% set b = params.BRUSH|int %}
  {% set y = v.rack_y0 + b * v.rack_dy %}
  G0 Z{v.travel_z} F{v.z_f}
  G0 X{v.rack_x} Y{y} A0 F{v.travel_f}
  G0 Z0 F{v.z_f}
  # TODO: engage coupling (servo / magnet) here
  G1 X{v.rack_x - 30} F3000     ; slide brush out of the rack slot
  G0 Z{v.travel_z} F{v.z_f}
  SET_GCODE_VARIABLE MACRO=_PAINTER_VARS VARIABLE=current_brush VALUE={b}

[gcode_macro TOOL_CHANGE]
gcode:
  {% set v = printer["gcode_macro _PAINTER_VARS"] %}
  {% if v.current_brush >= 0 %}
    TOOL_PLACE BRUSH={v.current_brush}
  {% endif %}
  TOOL_PICK BRUSH={params.BRUSH}

[gcode_macro DIP]
description: Load paint from a palette slot (a few short strokes through the paint)
gcode:
  {% set v = printer["gcode_macro _PAINTER_VARS"] %}
  {% set s = params.SLOT|int %}
  {% set x = v.palette_x0 + (s % v.palette_cols) * v.palette_dx %}
  {% set y = v.palette_y0 + (s // v.palette_cols) * v.palette_dy %}
  G0 Z{v.travel_z} F{v.z_f}
  G0 X{x - 6} Y{y} F{v.travel_f}
  G0 Z-1 F{v.z_f}
  {% for i in range(3) %}
    G1 X{x + 6} F1500
    G1 X{x - 6} F1500
  {% endfor %}
  G0 Z{v.travel_z} F{v.z_f}

[gcode_macro WASH]
description: Scrub the brush in the oil jar
gcode:
  {% set v = printer["gcode_macro _PAINTER_VARS"] %}
  G0 Z{v.travel_z} F{v.z_f}
  G0 X{v.wash_x + v.wash_r} Y{v.wash_y} F{v.travel_f}
  G0 Z{v.wash_z} F{v.z_f}
  {% for i in range(v.wash_circles) %}
    # note: write 0 - x, not -x: Klipper's '{' delimiter makes '{-' Jinja whitespace control and drops the sign
    G2 X{v.wash_x + v.wash_r} Y{v.wash_y} I{0 - v.wash_r} J0 F3000
  {% endfor %}
  G0 Z{v.travel_z} F{v.z_f}

[gcode_macro WIPE]
description: Wipe solvent off the brush on the rag
gcode:
  {% set v = printer["gcode_macro _PAINTER_VARS"] %}
  G0 Z{v.travel_z} F{v.z_f}
  {% for i in range(v.wipe_passes) %}
    G0 X{v.wipe_x - v.wipe_len / 2} Y{v.wipe_y} F{v.travel_f}
    G0 Z-1 F{v.z_f}
    G1 X{v.wipe_x + v.wipe_len / 2} F2400
    G0 Z{v.travel_z} F{v.z_f}
  {% endfor %}

[gcode_macro REFILL_PAUSE]
description: Ask the human to refill a palette slot, then RESUME
gcode:
  {% set v = printer["gcode_macro _PAINTER_VARS"] %}
  G0 Z{v.travel_z} F{v.z_f}
  M117 Refill palette slot {params.SLOT|default("?")} then RESUME
  RESPOND MSG="Refill palette slot {params.SLOT|default('?')} then send RESUME"
  PAUSE
