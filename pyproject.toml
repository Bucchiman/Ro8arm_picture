[project]
name = "painter"
version = "0.1.0"
description = "Oil painting machine: image -> human-like brush strokes -> simulator / Klipper G-code"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "opencv-python>=4.9",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
painter = "painter.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["painter*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
